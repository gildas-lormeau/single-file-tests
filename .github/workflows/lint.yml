name: Lint

on:
  push:
    branches: [main]
  pull_request:

# The suites of this repository run from the CI of the extension repositories (the job "functional"
# of SingleFile and SingleFile-MV3), against the commit pushed there. Here only the code is linted.
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v5
      -
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run linter
        run: npx eslint .
